


<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇 · 单文件版</title>
<style>
:root{
  --bg:#0a1018;
  --panel:rgba(255,255,255,.06);
  --text:#e8f0f5;
  --accent:#4ade80;
  --accent2:#22d3ee;
  --danger:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(circle at 50% 20%,#14202c,#05080c 80%);
  color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.game{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:10px;width:100%;max-width:100vw;
  padding-bottom:80px;
}

/* 顶部状态栏 */
.status{
  display:flex;align-items:center;gap:18px;
  background:var(--panel);
  border:1px solid rgba(74,222,128,.25);
  border-radius:12px;padding:8px 20px;font-size:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
.status .item{display:flex;align-items:center;gap:6px}
.status .lbl{font-size:13px;color:rgba(232,240,245,.55)}
.status .val{font-weight:800;font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums}
.status .item.hi .val{color:var(--accent2)}

/* 棋盘容器 */
.board-wrap{
  position:relative;border-radius:14px;padding:6px;
  background:linear-gradient(145deg,#1a2632,#0e151c);
  box-shadow:
    0 0 0 2px rgba(74,222,128,.35),
    0 0 0 4px rgba(74,222,128,.12),
    0 10px 30px rgba(0,0,0,.6);
  max-width:94vw;max-height:58vh;
  display:flex;align-items:center;justify-content:center;
}
canvas{
  display:block;border-radius:8px;touch-action:none;
  max-width:100%;max-height:100%;width:auto;height:auto;
  background:#0d141b;
}

/* 难度按钮 */
.diff{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.diff button{
  background:var(--panel);border:1px solid rgba(74,222,128,.3);
  color:var(--text);padding:8px 18px;border-radius:8px;
  font-size:15px;cursor:pointer;transition:.15s;font-weight:600;
}
.diff button.on{
  background:var(--accent);border-color:var(--accent);
  color:#08210f;font-weight:800;
}

/* 方向键包裹层 */
.pad-wrap{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;
}
.pad{
  display:flex;justify-content:center;align-items:center;
}
.dpad{position:relative;width:200px;height:200px}
.dpad button{
  position:absolute;background:var(--panel);
  border:1px solid rgba(74,222,128,.28);
  color:var(--accent);font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  -webkit-tap-highlight-color:transparent;
  transition:background .1s, transform .05s;
}
.dpad button:active{background:rgba(74,222,128,.28);transform:scale(.96)}
.dpad .up{top:0;left:67px;width:66px;height:66px;border-radius:12px 12px 0 0}
.dpad .down{bottom:0;left:67px;width:66px;height:66px;border-radius:0 0 12px 12px}
.dpad .left{top:67px;left:0;width:66px;height:66px;border-radius:12px 0 0 12px}
.dpad .right{top:67px;right:0;width:66px;height:66px;border-radius:0 12px 12px 0}
.dpad .center{
  top:67px;left:67px;width:66px;height:66px;border-radius:0;
  background:rgba(74,222,128,.05);pointer-events:none;
}

/* 署名 */
.brand{
  font-size:14px;letter-spacing:5px;
  color:rgba(74,222,128,.45);
  font-weight:400;pointer-events:none;
  text-shadow:0 0 12px rgba(74,222,128,.3);
  margin-top:2px;
}

/* 左下角：暂停/继续 */
.btn-pause{
  position:fixed;
  left:16px;bottom:18px;
  z-index:20;
  background:linear-gradient(180deg,rgba(74,222,128,.25),rgba(74,222,128,.1));
  border:1px solid rgba(74,222,128,.45);
  color:var(--text);
  padding:12px 20px;border-radius:12px;
  font-size:16px;font-weight:700;
  cursor:pointer;transition:.15s;
  box-shadow:0 6px 18px rgba(0,0,0,.45);
  -webkit-tap-highlight-color:transparent;
  min-width:110px;
}
.btn-pause:active{transform:scale(.96)}

/* 右下角：重新开始 */
.btn-restart{
  position:fixed;
  right:16px;bottom:18px;
  z-index:20;
  background:linear-gradient(180deg,rgba(34,211,238,.25),rgba(34,211,238,.1));
  border:1px solid rgba(34,211,238,.45);
  color:var(--text);
  padding:12px 20px;border-radius:12px;
  font-size:16px;font-weight:700;
  cursor:pointer;transition:.15s;
  box-shadow:0 6px 18px rgba(0,0,0,.45);
  -webkit-tap-highlight-color:transparent;
  min-width:110px;
}
.btn-restart:active{transform:scale(.96)}

/* 遮罩 */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:none;align-items:center;justify-content:center;z-index:30;
  backdrop-filter:blur(4px);
}
.overlay.on{display:flex}
.overlay .card{
  background:linear-gradient(145deg,#1a2632,#0e151c);
  border:2px solid var(--accent);border-radius:18px;
  padding:30px 44px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 40px rgba(74,222,128,.2);
  animation:pop .3s ease;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.overlay .card h2{font-size:28px;margin-bottom:8px;color:var(--accent)}
.overlay .card p{font-size:15px;color:rgba(232,240,245,.75);margin-bottom:20px}
.overlay .card button{
  background:var(--accent);border:none;color:#08210f;
  padding:11px 30px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;
}
.overlay .card button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="game">
  <div class="status">
    <div class="item"><span class="lbl">分数</span><span class="val" id="score">0</span></div>
    <div class="item hi"><span class="lbl">最高</span><span class="val" id="best">0</span></div>
    <div class="item"><span class="lbl">长度</span><span class="val" id="len">3</span></div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
  </div>

  <div class="diff">
    <button data-d="0">慢速</button>
    <button data-d="1" class="on">普通</button>
    <button data-d="2">快速</button>
    <button data-d="3">疯狂</button>
  </div>

  <div class="pad-wrap">
    <div class="pad">
      <div class="dpad">
        <button class="up"    id="btnU">▲</button>
        <button class="left"  id="btnL">◀</button>
        <button class="center"></button>
        <button class="right" id="btnR">▶</button>
        <button class="down"  id="btnD">▼</button>
      </div>
    </div>
    <div class="brand" id="brand"></div>
  </div>
</div>

<button class="btn-pause" id="btnPause">⏸ 暂停</button>
<button class="btn-restart" id="btnRestart">重新开始</button>

<div class="overlay" id="overlay">
  <div class="card">
    <h2 id="overTitle">游戏结束</h2>
    <p id="overSub">得分 0</p>
    <button id="btnAgain">再来一局</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   一、常量与状态
   ============================================================ */
var COLS = 24, ROWS = 24;
var CELL = 20;
var CW = COLS * CELL;
var CH = ROWS * CELL;

var canvas = document.getElementById('board');
canvas.width = CW;
canvas.height = CH;
var ctx = canvas.getContext('2d');

var scoreEl = document.getElementById('score');
var bestEl = document.getElementById('best');
var lenEl = document.getElementById('len');
var overlay = document.getElementById('overlay');
var overTitle = document.getElementById('overTitle');
var overSub = document.getElementById('overSub');
var pauseBtn = document.getElementById('btnPause');

var snake = [];
var dir = {x:1, y:0};
var nextDir = {x:1, y:0};
var food = {x:0, y:0};
var score = 0;
var best = 0;
var gameOver = false;
var paused = false;
var timer = null;
var difficulty = 1;
var tickMs = 220;

var DIFF = [
  {name:'慢速', ms:300},
  {name:'普通', ms:220},
  {name:'快速', ms:150},
  {name:'疯狂', ms:90}
];

/* ===== 底部署名加密：Base64 + 码点偏移(-7) ===== */
var BRAND_TEXT = (function(){
  try{
    var _enc = "WzIwODYwLDIxNzQwLDMyNjYxLDIxMjc3XQ==";
    var _arr = JSON.parse(atob(_enc));
    return _arr.map(function(c){ return String.fromCharCode(c - 7); }).join('');
  }catch(e){ return ''; }
})();

try{
  best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0;
}catch(e){ best = 0; }

/* ============================================================
   二、初始化游戏
   ============================================================ */
function startGame(){
  if(timer){ clearTimeout(timer); timer = null; }

  snake = [
    {x:7, y:12},
    {x:6, y:12},
    {x:5, y:12}
  ];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  gameOver = false;
  paused = false;
  pauseBtn.textContent = '⏸ 暂停';
  pauseBtn.style.background = '';
  pauseBtn.style.borderColor = '';
  pauseBtn.style.color = '';
  overlay.classList.remove('on');

  placeFood();
  updateUI();
  render();
  scheduleTick();
}

/* ============================================================
   三、食物生成
   ============================================================ */
function placeFood(){
  var empty = [];
  for(var y=0;y<ROWS;y++)
    for(var x=0;x<COLS;x++){
      if(!snake.some(function(s){ return s.x===x && s.y===y; })){
        empty.push({x:x, y:y});
      }
    }
  if(empty.length === 0){ food = null; return; }
  food = empty[Math.floor(Math.random()*empty.length)];
}

/* ============================================================
   四、游戏主循环
   ============================================================ */
function scheduleTick(){
  if(timer) clearTimeout(timer);
  timer = setTimeout(tick, tickMs);
}
function tick(){
  if(gameOver || paused){ return; }

  dir = nextDir;

  var head = snake[0];
  var nx = head.x + dir.x;
  var ny = head.y + dir.y;

  if(nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS){
    endGame();
    return;
  }
  var willGrow = food && (nx === food.x && ny === food.y);
  var bodyToCheck = willGrow ? snake : snake.slice(0, snake.length-1);
  for(var i=0;i<bodyToCheck.length;i++){
    if(bodyToCheck[i].x === nx && bodyToCheck[i].y === ny){
      endGame();
      return;
    }
  }

  snake.unshift({x:nx, y:ny});

  if(willGrow){
    score += 10;
    if(score > best){
      best = score;
      try{ localStorage.setItem('snake_best', String(best)); }catch(e){}
    }
    placeFood();
    updateUI();
  }else{
    snake.pop();
  }

  render();
  scheduleTick();
}

function endGame(){
  gameOver = true;
  if(timer){ clearTimeout(timer); timer = null; }
  overTitle.textContent = '游戏结束';
  overSub.textContent = '得分 ' + score + ' · 最高 ' + best;
  overlay.classList.add('on');
  render();
}

/* ============================================================
   五、渲染
   ============================================================ */
function render(){
  ctx.fillStyle = '#0d141b';
  ctx.fillRect(0, 0, CW, CH);

  // 网格
  ctx.strokeStyle = 'rgba(74,222,128,.06)';
  ctx.lineWidth = 1;
  for(var i=0;i<=COLS;i++){
    ctx.beginPath();
    ctx.moveTo(i*CELL + 0.5, 0);
    ctx.lineTo(i*CELL + 0.5, CH);
    ctx.stroke();
  }
  for(var j=0;j<=ROWS;j++){
    ctx.beginPath();
    ctx.moveTo(0, j*CELL + 0.5);
    ctx.lineTo(CW, j*CELL + 0.5);
    ctx.stroke();
  }

  /* ★★★ 食物：紫色 ★★★ */
  if(food){
    var fx = food.x * CELL + CELL/2;
    var fy = food.y * CELL + CELL/2;
    var t = Date.now() / 300;
    var pulse = 1 + Math.sin(t) * 0.08;
    var r = (CELL/2 - 2) * pulse;

    ctx.save();
    ctx.shadowColor = '#a78bfa';                     // 紫色外发光
    ctx.shadowBlur = 14;
    var fg = ctx.createRadialGradient(fx-3, fy-3, 1, fx, fy, r);
    fg.addColorStop(0, '#ddd6fe');                   // 中心浅紫高光
    fg.addColorStop(0.6, '#a78bfa');                 // 主色紫
    fg.addColorStop(1, '#6d28d9');                   // 边缘深紫
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(fx, fy, r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // 蛇
  for(var k=snake.length-1;k>=0;k--){
    var seg = snake[k];
    var px = seg.x * CELL;
    var py = seg.y * CELL;
    var ratio = 1 - k / Math.max(snake.length, 1);

    var r1 = Math.round(34 + 50*ratio);
    var g1 = Math.round(197 - 20*ratio);
    var b1 = Math.round(94 + 30*ratio);
    var col = 'rgb(' + r1 + ',' + g1 + ',' + b1 + ')';

    ctx.save();
    if(k === 0){
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 10;
    }
    ctx.fillStyle = col;
    roundRect(px+1, py+1, CELL-2, CELL-2, 5);
    ctx.fill();
    ctx.restore();
  }

  // 蛇眼
  if(snake.length > 0){
    var h = snake[0];
    var hx = h.x * CELL + CELL/2;
    var hy = h.y * CELL + CELL/2;
    var ex = dir.x * 3;
    var ey = dir.y * 3;
    var perpX = dir.y, perpY = dir.x;
    ctx.fillStyle = '#0d141b';
    ctx.beginPath();
    ctx.arc(hx + ex + perpX*4, hy + ey + perpY*4, 2.4, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx + ex - perpX*4, hy + ey - perpY*4, 2.4, 0, Math.PI*2);
    ctx.fill();
  }

  // 暂停遮罩
  if(paused && !gameOver){
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, CW, CH);

    var barW = 22;
    var barH = 70;
    var gap = 22;
    var totalW = barW*2 + gap;
    var startX = (CW - totalW) / 2;
    var startY = (CH - barH) / 2;

    ctx.save();
    ctx.fillStyle = 'rgba(74,222,128,.95)';
    ctx.shadowColor = '#4ade80';
    ctx.shadowBlur = 18;
    roundRect(startX, startY, barW, barH, 6);
    ctx.fill();
    roundRect(startX + barW + gap, startY, barW, barH, 6);
    ctx.fill();
    ctx.restore();
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* ============================================================
   六、UI
   ============================================================ */
function updateUI(){
  scoreEl.textContent = score;
  bestEl.textContent = best;
  lenEl.textContent = snake.length;
}

/* ============================================================
   七、方向控制
   ============================================================ */
function setDir(nx, ny){
  if(gameOver || paused) return;
  if(nx === -dir.x && ny === -dir.y) return;
  if(nx === nextDir.x && ny === nextDir.y) return;
  nextDir = {x:nx, y:ny};
}

document.addEventListener('keydown', function(e){
  var k = e.key;
  if(k === ' ' || k === 'p' || k === 'P'){
    e.preventDefault();
    togglePause();
    return;
  }
  if(k === 'ArrowUp'    || k === 'w' || k === 'W'){ e.preventDefault(); setDir(0,-1); }
  else if(k === 'ArrowDown'  || k === 's' || k === 'S'){ e.preventDefault(); setDir(0,1); }
  else if(k === 'ArrowLeft'  || k === 'a' || k === 'A'){ e.preventDefault(); setDir(-1,0); }
  else if(k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); setDir(1,0); }
});

document.getElementById('btnU').onclick = function(){ setDir(0,-1); };
document.getElementById('btnD').onclick = function(){ setDir(0,1); };
document.getElementById('btnL').onclick = function(){ setDir(-1,0); };
document.getElementById('btnR').onclick = function(){ setDir(1,0); };

/* 触摸滑动 */
var touchStart = null;
canvas.addEventListener('touchstart', function(e){
  if(e.touches.length){
    touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
  }
}, {passive:true});
canvas.addEventListener('touchmove', function(e){
  if(!touchStart || !e.touches.length) return;
  var dx = e.touches[0].clientX - touchStart.x;
  var dy = e.touches[0].clientY - touchStart.y;
  if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if(Math.abs(dx) > Math.abs(dy)){
    setDir(dx > 0 ? 1 : -1, 0);
  }else{
    setDir(0, dy > 0 ? 1 : -1);
  }
  touchStart = null;
}, {passive:true});
canvas.addEventListener('touchend', function(){ touchStart = null; }, {passive:true});

/* 暂停 */
function togglePause(){
  if(gameOver) return;
  paused = !paused;
  if(paused){
    if(timer){ clearTimeout(timer); timer = null; }
    pauseBtn.textContent = '▶ 继续';
    pauseBtn.style.background = 'var(--accent)';
    pauseBtn.style.borderColor = 'var(--accent)';
    pauseBtn.style.color = '#08210f';
    render();
  }else{
    pauseBtn.textContent = '⏸ 暂停';
    pauseBtn.style.background = '';
    pauseBtn.style.borderColor = '';
    pauseBtn.style.color = '';
    render();
    scheduleTick();
  }
}
pauseBtn.onclick = togglePause;

document.getElementById('btnRestart').onclick = startGame;
document.getElementById('btnAgain').onclick = startGame;

document.querySelectorAll('.diff button').forEach(function(b){
  b.onclick = function(){
    difficulty = parseInt(b.dataset.d, 10);
    tickMs = DIFF[difficulty].ms;
    document.querySelectorAll('.diff button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    startGame();
  };
});

/* 食物脉冲刷新 */
setInterval(function(){
  if(!gameOver && !paused && food) render();
}, 80);

/* 署名 */
(function(){
  var el = document.getElementById('brand');
  if(el && BRAND_TEXT) el.textContent = BRAND_TEXT;
})();

/* 启动 */
tickMs = DIFF[difficulty].ms;
startGame();
})();
</script>
</body>
</html>
